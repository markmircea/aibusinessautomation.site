<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example: sample platform architecture</title>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,500,600,700">
  <link rel="stylesheet" href="diagram.css">
</head>
<body>
  <div id="frame"></div>
  <script src="diagram.js"></script>
  <script>
    renderDiagram(document.getElementById('frame'), {
      eyebrow: 'How it works',
      title: 'Sample platform: request in, result out',
      columns: [
        {
          id: 'clients',
          width: 1,
          nodes: [
            {
              id: 'web',
              icon: 'monitor',
              title: 'Client app',
              text: 'Where the work starts — one form, no spreadsheet.',
              chips: ['Web', 'Kiosk mode']
            },
            {
              id: 'mobile',
              icon: 'smartphone',
              title: 'Mobile client',
              text: 'Same flow on the shop floor, offline tolerant.'
            }
          ]
        },
        {
          id: 'edge',
          label: 'Edge layer',
          width: 1.3,
          nodes: [
            {
              id: 'gateway',
              icon: 'globe',
              title: 'API gateway',
              text: 'Auth, validation and routing for every request.',
              chips: ['JWT', 'Rate limit', 'OpenAPI'],
              accent: true
            },
            {
              id: 'queue',
              icon: 'box',
              title: 'Job queue',
              text: 'Slow work is handed off so the UI never blocks.'
            }
          ]
        },
        {
          id: 'services',
          label: 'Services',
          width: 1,
          nodes: [
            {
              id: 'worker',
              icon: 'zap',
              title: 'Worker',
              text: 'Runs the jobs, retries with backoff.',
              chips: ['Retries', 'Concurrency 4']
            },
            {
              id: 'rules',
              icon: 'workflow',
              title: 'Rule engine',
              text: 'Client rules kept as data, edited without a release.'
            },
            {
              id: 'db',
              icon: 'database',
              title: 'Database'
            }
          ]
        },
        {
          id: 'storage',
          width: 1,
          nodes: [
            {
              id: 'files',
              icon: 'image',
              title: 'Object storage',
              text: 'Scans, photos and generated documents.',
              chips: ['Versioned']
            },
            {
              id: 'audit',
              title: 'Audit log'
            }
          ]
        }
      ],
      edges: [
        { from: 'web', to: 'gateway', label: 'REST' },
        { from: 'mobile', to: 'gateway', label: 'HTTPS' },
        { from: 'gateway', to: 'web', label: 'progress' },
        { from: 'gateway', to: 'queue', label: 'enqueue' },
        { from: 'queue', to: 'worker', label: 'jobs', dashed: true },
        { from: 'worker', to: 'db' },
        { from: 'worker', to: 'rules' },
        { from: 'worker', to: 'files', label: 'artifacts' },
        { from: 'rules', to: 'db', label: 'read rules', dashed: true },
        { from: 'db', to: 'audit', both: true }
      ],
      note: 'Sample diagram — every renderer feature is exercised: header, group boxes, icons, chips, accent node, dashed and bidirectional connectors.'
    });
  </script>
</body>
</html>
