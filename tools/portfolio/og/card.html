<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card</title>
<!-- 1200x630 link-preview card (Open Graph / Twitter) in the style of the site's PageHero: wordmark, headline with the
     highlight on its own line in accent indigo, one line of text, the hero's pills, and a strip of up to 4 screenshots
     along the bottom. Params: title, highlight, sub, pills ('|'-separated), label (small caps above the strip),
     images (comma-separated image URLs).
     Rendered by tools/portfolio/og_images.py. -->
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
    #card {
        position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0B1020;
        display: flex; flex-direction: column; align-items: center;
    }
    /* The text block is centred in whatever height the strip leaves, so short and long cards both balance. */
    #top { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center;
           justify-content: center; }
    #card::before {
        content: ""; position: absolute; inset: 0;
        background:
            radial-gradient(60% 55% at 50% 0%, rgba(91,108,255,0.28) 0%, transparent 70%),
            radial-gradient(45% 45% at 12% 18%, rgba(47,75,196,0.22) 0%, transparent 70%),
            radial-gradient(45% 45% at 88% 22%, rgba(27,42,107,0.35) 0%, transparent 70%);
    }
    #mark { position: relative; font-size: 30px; font-weight: 700; color: #F2F4FA; letter-spacing: -0.01em; }
    #mark span { color: #7C89FF; }
    h1 {
        position: relative; margin: 22px 0 0; max-width: 1080px; text-align: center; color: #F2F4FA;
        font-size: 58px; line-height: 1.06; font-weight: 800; letter-spacing: -0.025em;
    }
    h1 span { display: block; color: #7C89FF; }
    #sub { position: relative; margin-top: 18px; max-width: 1000px; color: #A8B0C8; font-size: 24px; font-weight: 500;
           text-align: center; line-height: 1.35; }
    #pills { position: relative; margin-top: 24px; max-width: 1100px; display: flex; flex-wrap: wrap;
             justify-content: center; gap: 10px; }
    #pills span { padding: 7px 16px; border-radius: 999px; border: 1px solid #1E2640; background: rgba(20,26,46,.6);
                  color: #A8B0C8; font-size: 17px; font-weight: 500; }
    #sub:empty, #pills:empty, #label:empty { display: none; }
    #bottom { position: relative; margin-bottom: -30px; display: flex; flex-direction: column; align-items: center;
              gap: 14px; }
    #bottom.n4 { margin-bottom: 26px; }
    #label { color: #A8B0C8; font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    #strip { display: flex; justify-content: center; gap: 24px; }
    #strip img {
        display: block; width: 360px; height: 203px; object-fit: cover; border-radius: 12px;
        border: 1px solid #1E2640; box-shadow: 0 18px 44px -10px rgba(0,0,0,.65);
    }
    #strip.n4 { gap: 18px; }
    #strip.n4 img { width: 272px; height: 153px; }
</style>
</head>
<body style="margin:0">
<div id="card">
    <div id="top">
        <div id="mark"><span>AI</span>Brain<span>L.ink</span></div>
        <h1 id="title"></h1>
        <div id="sub"></div>
        <div id="pills"></div>
    </div>
    <div id="bottom">
        <div id="label"></div>
        <div id="strip"></div>
    </div>
</div>
<script>
    const params = new URLSearchParams(location.search);
    const h1 = document.getElementById('title');
    h1.textContent = params.get('title') || '';
    if (params.get('highlight')) {
        const span = document.createElement('span');
        span.textContent = params.get('highlight');
        h1.appendChild(span);
    }
    document.getElementById('sub').textContent = params.get('sub') || '';
    const pills = document.getElementById('pills');
    for (const text of (params.get('pills') || '').split('|').filter(Boolean)) {
        const pill = document.createElement('span');
        pill.textContent = text;
        pills.appendChild(pill);
    }
    document.getElementById('label').textContent = params.get('label') || '';
    const srcs = (params.get('images') || '').split(',').filter(Boolean);
    const strip = document.getElementById('strip');
    strip.classList.toggle('n4', srcs.length === 4);
    document.getElementById('bottom').classList.toggle('n4', srcs.length === 4);
    const loads = srcs.map((src) => new Promise((resolve) => {
        const img = document.createElement('img');
        img.alt = '';
        img.onload = resolve;
        img.onerror = resolve;
        img.src = src;
        strip.appendChild(img);
    }));
    Promise.all([...loads, document.fonts.ready]).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
