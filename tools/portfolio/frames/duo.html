<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>duo frame</title>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,500,600,700">
<style>
  /* Two real windows of one app, overlapping like a desktop: an app window behind, a browser window in front.
     Params: back, backTitle, front, frontUrl. */
  body { margin: 0; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
  #frame {
    position: relative; width: 1600px; height: 900px; overflow: hidden; background: #0B1020;
    background-image:
      radial-gradient(60% 55% at 50% 0%, rgba(91,108,255,0.28) 0%, transparent 70%),
      radial-gradient(45% 45% at 12% 18%, rgba(47,75,196,0.22) 0%, transparent 70%),
      radial-gradient(45% 45% at 88% 22%, rgba(27,42,107,0.35) 0%, transparent 70%);
  }
  .win { position: absolute; border-radius: 14px; overflow: hidden; border: 1px solid #1E2640;
         box-shadow: 0 16px 40px -8px rgba(0,0,0,.55); background: #141A2E; display: flex; flex-direction: column; }
  .bar { height: 36px; flex: 0 0 36px; display: flex; align-items: center; padding: 0 16px; background: #141A2E;
         color: #A8B0C8; font-size: 14px; border-bottom: 1px solid #1E2640; }
  .bar .title { flex: 1; }
  .bar .ctl { color: #6B7490; letter-spacing: 14px; font-size: 13px; }
  .dots { display: flex; gap: 8px; margin-right: 16px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #3A4256; display: block; }
  .pill { flex: 1; display: flex; justify-content: center; }
  .pill span { background: #0B1020; border-radius: 8px; padding: 5px 14px; font-size: 13px; color: #A8B0C8; }
  .shot { flex: 1; min-height: 0; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  #back  { left: 70px;  top: 56px;  width: 1180px; height: 760px; }
  #front { left: 820px; top: 360px; width: 700px;  height: 470px; box-shadow: 0 24px 60px -10px rgba(0,0,0,.7); }
  #front .shot img { object-position: top center; }
</style>
</head>
<body>
<div id="frame">
  <div class="win" id="back">
    <div class="bar"><span class="title" id="backTitle"></span><span class="ctl">─ ▢ ✕</span></div>
    <div class="shot"><img id="backImg" alt=""></div>
  </div>
  <div class="win" id="front">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="pill"><span>🔒 <b id="frontUrl" style="font-weight:500"></b></span></div></div>
    <div class="shot"><img id="frontImg" alt=""></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('backTitle').textContent = q.get('backTitle') || '';
  document.getElementById('frontUrl').textContent = q.get('frontUrl') || '';
  const imgs = [['backImg', q.get('back')], ['frontImg', q.get('front')]];
  let pending = imgs.length;
  const done = () => { if (--pending === 0) document.body.dataset.ready = '1'; };
  for (const [id, src] of imgs) {
    const el = document.getElementById(id);
    el.onload = done; el.onerror = done;
    el.src = src || '';
    if (!src) done();
  }
</script>
</body>
</html>
