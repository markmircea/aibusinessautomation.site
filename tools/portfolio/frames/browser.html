<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser frame</title>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=figtree:400,500,600,700">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
    #frame {
        position: relative;
        width: 1600px; height: 900px;
        background: #0B1020;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    #frame::before {
        content: ""; position: absolute; inset: 0;
        background:
            radial-gradient(60% 55% at 50% 0%, rgba(91,108,255,0.28) 0%, transparent 70%),
            radial-gradient(45% 45% at 12% 18%, rgba(47,75,196,0.22) 0%, transparent 70%),
            radial-gradient(45% 45% at 88% 22%, rgba(27,42,107,0.35) 0%, transparent 70%);
    }
    #window {
        position: relative; z-index: 1;
        width: 1360px; height: 780px;
        border: 1px solid #1E2640; border-radius: 14px;
        box-shadow: 0 16px 40px -8px rgba(0,0,0,.55);
        background: #141A2E; overflow: hidden;
        display: flex; flex-direction: column;
    }
    #bar {
        position: relative; flex: 0 0 44px;
        background: #141A2E;
        display: flex; align-items: center; gap: 8px; padding: 0 16px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #3A4256; }
    #addr {
        position: absolute; left: 50%; transform: translateX(-50%);
        background: #0B1020; border-radius: 8px;
        color: #A8B0C8; font-size: 14px; padding: 6px 14px;
        display: flex; align-items: center; gap: 8px; max-width: 640px;
        white-space: nowrap; overflow: hidden;
    }
    #addr .lock { font-size: 12px; }
    #shot {
        flex: 1 1 auto; width: 100%; min-height: 0; display: block;
        object-fit: cover; object-position: top center;
    }
</style>
</head>
<body style="margin:0">
<div id="frame">
    <div id="window">
        <div id="bar">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <div id="addr"><span class="lock">🔒</span><span id="url"></span></div>
        </div>
        <img id="shot" alt="">
    </div>
</div>
<script>
    const params = new URLSearchParams(location.search);
    document.getElementById('url').textContent = params.get('url') || 'example.com';
    const ready = () => { document.body.dataset.ready = '1'; };
    const img = document.getElementById('shot');
    const src = params.get('src');
    if (src) { img.onload = ready; img.onerror = ready; img.src = src; } else { ready(); }
</script>
</body>
</html>
